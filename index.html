<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Người Sở Hữu: Chan Canh Chua (C3)</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f2f5; 
            padding: 20px 10px; 
            margin: 0;
        }
        .container { 
            max-width: 800px; 
            margin: auto; 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }
        h2 { 
            text-align: center; 
            color: #1a73e8; 
            margin-bottom: 5px;
            font-weight: 700;
            font-size: 24px;
        }
        .search-box { 
            display: flex;
            flex-direction: column; 
            gap: 12px; 
        }
        @media (min-width: 600px) {
            .search-box { flex-direction: row; } 
        }
        input[type="text"] { 
            flex: 1; 
            padding: 14px 18px; 
            border: 2px solid #e0e0e0; 
            border-radius: 8px; 
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }
        input[type="text"]:focus { 
            border-color: #1a73e8; 
            box-shadow: 0 0 8px rgba(26,115,232,0.2);
        }
        button { 
            padding: 14px 35px; 
            background: #1a73e8; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 16px;
            white-space: nowrap;
            transition: background 0.3s;
        }
        button:hover { 
            background: #1557b0; 
        }
        
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            margin-top: 15px;
        }
        .exact-match-label {
            display: inline-flex;
            align-items: center;
            font-size: 14px;
            color: #444;
            cursor: pointer;
            font-weight: 500;
        }
        .exact-match-label input {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            cursor: pointer;
        }
        .filter-select {
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            flex: 1;
            min-width: 140px;
            background-color: #fff;
            cursor: pointer;
        }
        .filter-select:focus {
            border-color: #1a73e8;
        }

        #resultArea { margin-top: 25px; }
        .card-container {
            display: flex;
            flex-direction: column;
            gap: 15px; 
        }
        .card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }
        .card-header {
            background-color: #f8f9fa;
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stt-badge {
            background-color: #1a73e8;
            color: white;
            font-weight: bold;
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .status-badge {
            font-weight: bold;
            font-size: 14px;
        }
        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px; 
        }
        .data-row {
            display: flex;
            justify-content: space-between; 
            align-items: flex-start; 
            gap: 15px; 
            padding-bottom: 8px;
            border-bottom: 1px dashed #f0f0f0;
        }
        .data-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .data-label {
            color: #666;
            font-size: 14px;
            min-width: 110px; 
            flex-shrink: 0;
        }
        .data-value {
            color: #222;
            font-size: 15px;
            text-align: right; 
            word-wrap: break-word; 
            word-break: break-word; 
        }
        .highlight {
            background-color: #fff176;
            color: #d32f2f;
            padding: 0 2px;
            border-radius: 3px;
        }
        .text-blue { color: #0056b3; }
        .font-bold { font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="margin-bottom: 5px;">Khách hàng cài App</h2>
        <p id="totalCount" style="text-align: center; color: #333; font-size: 14px; margin-top: 0; margin-bottom: 25px; font-style: italic;">
            Đang tải dữ liệu đếm...
        </p>
        <p id="updateTime" style="text-align: center; color: #666; font-size: 13px; margin-top: -20px; margin-bottom: 25px; font-style: italic;">
            (Đã cập nhật đến: Đang tải...)
        </p>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Nhập mã hoặc tên..." onkeypress="handleKeyPress(event)">
            <button onclick="fetchData()">Tra cứu</button>
        </div>
        
        <div class="filter-group">
            <label class="exact-match-label">
                <input type="checkbox" id="exactMatch"> Tìm chính xác 100%
            </label>
            
            <!-- ĐÃ SỬA: Danh sách Xã và Ấp giờ đây sẽ rỗng và được điều khiển bằng JavaScript -->
            <select id="xaFilter" class="filter-select" onchange="handleXaChange()">
                <option value="">-- Tất cả Xã --</option>
            </select>

            <select id="apFilter" class="filter-select">
                <option value="">-- Tất cả Ấp --</option>
            </select>
        </div>
        
        <div id="resultArea"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://kezzrlltzddpdtktfqzk.supabase.co';
        const supabaseKey = 'sb_publishable_-OA922t0e8G3z3hM0hwguQ_GIAaGmec';
        const client = supabase.createClient(supabaseUrl, supabaseKey);

        // ĐÃ SỬA: Dữ liệu Xã/Ấp được trích xuất chuẩn 100% từ bảng tra_cuu
        const locationData = {
            "Xã Hòa Long": [
                "Hòa Bình", "Hòa Ninh", "Hòa Định", "Long An", "Long Bình", 
                "Long Bửu", "Long Hòa", "Long Hưng", "Long Hưng 1", "Long Hưng 2", 
                "Long Hội", "Long Khánh", "Long Khánh A", "Long Khánh B", 
                "Long Phú", "Long Thuận", "Long Thành", "Long Thành A", 
                "Long Thành B", "Long Định", "Thành Tấn", "Tân An", "Tân Hưng", 
                "Tân Khánh", "Tân Mỹ", "Tân Phú", "Tân Thuận", "Tân Định", 
                "Ấp 1", "Ấp 2", "Ấp 3", "Ấp 4", "Ấp 5"
            ],
            "Xã Lai Vung": [
                "An Bình", "An Hòa", "An Khương", "An Lạc", "An Lợi", "An Lợi A", 
                "An Lợi B", "An Ninh", "An Phong", "An Phú", "An Thạnh", "An Định", 
                "Bình An", "Hòa Lạc", "Tân An", "Tân Bình", "Tân Hưng", "Tân Khánh", 
                "Tân Lộc", "Tân Lợi", "Tân Mỹ", "Tân Phú", "Tân Quí", "Tân Thuận", 
                "Tân Thạnh", "Tân Định", "Tấn Khánh"
            ],
            "Xã Lấp Vò": [
                "An Hòa", "An Khượng", "An Lạc", "An Lợi A", "An Ninh", "An Phong", 
                "Bình An", "Bình Hiệp A", "Bình Hòa", "Bình Thành 2", "Bình Thạnh 1", 
                "Vĩnh Bình", "Vĩnh Lợi"
            ],
            "Xã Mỹ An Hưng": [
                "An Bình", "An Hòa", "An Lợi A", "An Lợi B", "An Ninh", 
                "Tân Hòa Đông"
            ],
            "Xã Phong Hòa": [
                "Hòa Bình", "Hòa Khánh", "Hòa Ninh", "Hòa Tân", "Hòa Định 1", 
                "Hòa Định 2", "Long An", "Thới Hòa", "Thới Mỹ", "Thới Mỹ 1", 
                "Thới Mỹ 2", "Tân An", "Tân Bình", "Tân Hưng", 
                "Tân Hưng (Tân Thuận PH cũ)", "Tân Lợi", "Tân Mỹ", "Tân Phong", 
                "Tân Phú", "Tân Quới", "Tân Thuận 1", "Tân Thạnh", "Tân Thới", 
                "Định Mỹ", "Định Phong", "Định Phú", "Định Thành", "Định Tân"
            ],
            "Xã Tân Dương": [
                "Hưng Lợi Tây", "Hậu Thành", "Tân Long", "Tân Lộc B", "Tân Thuận A"
            ],
            "Xã Tân Khánh Trung": [
                "An Bình", "An Phong", "Hậu Thành", "Vĩnh Bình"
            ],
            "Xã Tân Phú Trung": [
                "Tân Lập", "Tân Lợi", "Tân Quới"
            ]
        };

        // Hàm nạp danh sách Xã vào ô tùy chọn lúc mới mở trang
        function initDropdowns() {
            const xaSelect = document.getElementById('xaFilter');
            for (const xa in locationData) {
                const option = document.createElement('option');
                option.value = xa;
                option.textContent = xa;
                xaSelect.appendChild(option);
            }
        }

        // Hàm bắt sự kiện khi người dùng đổi Xã -> Tự động cập nhật danh sách Ấp tương ứng
        function handleXaChange() {
            const xaSelect = document.getElementById('xaFilter');
            const apSelect = document.getElementById('apFilter');
            const selectedXa = xaSelect.value;
            
            // Luôn xóa danh sách Ấp cũ đi mỗi khi chọn lại Xã
            apSelect.innerHTML = '<option value="">-- Tất cả Ấp --</option>';
            
            // Đẩy dữ liệu Ấp mới vào nếu Xã đó có dữ liệu
            if (selectedXa && locationData[selectedXa]) {
                const apList = locationData[selectedXa];
                apList.forEach(ap => {
                    const option = document.createElement('option');
                    option.value = ap;
                    option.textContent = ap;
                    apSelect.appendChild(option);
                });
            }
        }

        window.onload = async function() {
            // Nạp dữ liệu bộ lọc Xã ngay khi trang vừa tải
            initDropdowns();

            const countElement = document.getElementById('totalCount');
            const updateTimeElement = document.getElementById('updateTime');

            const countAppPromise = client.from('khach_hang_cai_app').select('*', { count: 'exact', head: true });
            const countTongPromise = client.from('tra_cuu').select('*', { count: 'exact', head: true });
            
            const [resApp, resTong] = await Promise.all([countAppPromise, countTongPromise]);

            if (resApp.error) {
                countElement.innerHTML = `<span style="color: red;">(Lỗi tải dữ liệu)</span>`;
            } else {
                const daCai = resApp.count || 0;
                let text = `(Đã cài App: ${daCai.toLocaleString('vi-VN')})`;
                if (!resTong.error && resTong.count > 0) {
                    const tongKH = resTong.count;
                    const tyLe = ((daCai / tongKH) * 100).toFixed(2);
                    text = `(Tổng KH: ${tongKH.toLocaleString('vi-VN')} | Đã cài App: ${daCai.toLocaleString('vi-VN')} - ${tyLe}%)`;
                }
                countElement.innerHTML = text;
            }

            const today = new Date();
            const dd = String(today.getDate()).padStart(2, '0');
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const yyyy = today.getFullYear();
            
            updateTimeElement.innerHTML = `(Đã cập nhật đến: 07:00:00 ${dd}/${mm}/${yyyy})`;
        };

        function handleKeyPress(e) {
            if (e.key === 'Enter') fetchData();
        }

        function highlightText(text, keywordStr) {
            if (!text) return '';
            let resultString = String(text);
            const words = keywordStr.split(/\s+/).filter(w => w.length > 0);
            words.forEach(word => {
                const regex = new RegExp(`(${word})`, 'gi');
                resultString = resultString.replace(regex, '<span class="highlight">$1</span>');
            });
            return resultString;
        }

        async function fetchData() {
            const rawKeyword = document.getElementById('searchInput').value.trim();
            const resultBox = document.getElementById('resultArea');
            
            const isExact = document.getElementById('exactMatch').checked;
            const xaFilter = document.getElementById('xaFilter').value;
            const apFilter = document.getElementById('apFilter').value;

            if (rawKeyword === "") {
                alert("Vui lòng nhập thông tin để tra cứu!");
                return;
            }

            const safeKeyword = rawKeyword.replace(/,/g, ' ').replace(/\s+/g, ' ').trim();
            const searchPattern = safeKeyword.replace(/\s+/g, '%');

            resultBox.innerHTML = `<p style="color: #666; text-align: center; font-weight: bold;">⏳ Đang truy xuất đối chiếu dữ liệu...</p>`;

            let queryTraCuu = client.from('tra_cuu').select('*').limit(11);
            
            if (xaFilter !== "") {
                queryTraCuu = queryTraCuu.eq('Xã', xaFilter);
            }
            if (apFilter !== "") {
                queryTraCuu = queryTraCuu.eq('Ấp', apFilter);
            }

            if (isExact) {
                queryTraCuu = queryTraCuu.or(`MA_KHANG.ilike.${safeKeyword},TEN_KHANG.ilike.${safeKeyword}`);
            } else {
                queryTraCuu = queryTraCuu.or(`MA_KHANG.ilike.%${searchPattern}%,TEN_KHANG.ilike.%${searchPattern}%`);
            }

            const { data: traCuuData, error: traCuuError } = await queryTraCuu;

            if (traCuuError) {
                resultBox.innerHTML = `<div class="card"><div class="card-body"><p style="color: red; margin:0;">Lỗi kết nối máy chủ</p></div></div>`;
                return;
            }

            if (!traCuuData || traCuuData.length === 0) {
                resultBox.innerHTML = `
                    <div class="card" style="background-color: #ffebee; border-color: #ffcdd2;">
                        <div class="card-body">
                            <p style="color: #d32f2f; font-weight: bold; text-align: center; margin: 0;">Không tìm thấy khách hàng nào</p>
                        </div>
                    </div>
                `;
                return;
            }

            const maKhangList = traCuuData.map(item => item['MA_KHANG']);

            const { data: appData } = await client
                .from('khach_hang_cai_app')
                .select('*')
                .in('Mã khách hàng', maKhangList);

            const appMap = new Map();
            if (appData) {
                appData.forEach(item => {
                    appMap.set(item['Mã khách hàng'], item);
                });
            }

            const hasMore = traCuuData.length > 10;
            const displayText = hasMore ? '> 10' : traCuuData.length;
            const displayData = hasMore ? traCuuData.slice(0, 10) : traCuuData;

            let html = `
                <p style="color: #28a745; font-weight: bold; margin-bottom: 15px;">
                    ✔ Tìm thấy ${displayText} kết quả <span style="font-weight: normal; color: #d32f2f; font-style: italic; font-size: 14px;">(Hiện tối đa 10)</span>:
                </p>
                <div class="card-container">
            `;
            
            displayData.forEach((item, index) => {
                const appInfo = appMap.get(item['MA_KHANG']);
                const isDaCai = !!appInfo; 
                
                const rawStatus = isDaCai ? 'Đã cài App' : 'Chưa cài App';
                const statusColor = isDaCai ? '#28a745' : '#757575';

                let cardBodyHtml = `
                    <div class="data-row">
                        <span class="data-label">Mã KH:</span>
                        <span class="data-value text-blue font-bold">${highlightText(item['MA_KHANG'], safeKeyword)}</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Tên KH:</span>
                        <span class="data-value font-bold">${highlightText(item['TEN_KHANG'], safeKeyword)}</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Số ĐT:</span>
                        <span class="data-value font-bold">${item['DTHOAI'] || ''}</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Địa chỉ:</span>
                        <span class="data-value">${item['DCHI_KH'] || ''}</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Tên trạm:</span>
                        <span class="data-value">${item['TEN_TRAM'] || ''}</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Số cột:</span>
                        <span class="data-value">${item['SO_COT'] || ''}</span>
                    </div>
                    <div class="data-row">
                        <span class="data-label">Khu vực:</span>
                        <span class="data-value">${item['Ấp'] || ''}, ${item['Xã'] || ''}<br>
                        <small style="color: #666;">(Trưởng ấp: <strong>${item['Trưởng ấp'] || ''}</strong>)</small></span>
                    </div>
                `;

                html += `
                    <div class="card">
                        <div class="card-header">
                            <span class="stt-badge">STT: ${index + 1}</span>
                            <span class="status-badge" style="color: ${statusColor};">${rawStatus}</span>
                        </div>
                        <div class="card-body">
                            ${cardBodyHtml}
                        </div>
                    </div>
                `;
            });
            
            html += `</div>`;
            resultBox.innerHTML = html;
        }
    </script>
</body>
</html>
